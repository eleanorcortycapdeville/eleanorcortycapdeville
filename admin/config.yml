backend:
  name: git-gateway
  branch: main

media_folder: uploads
public_folder: /uploads

collections:
  - name: settings
    label: Parametres du site
    files:
      - name: general
        label: Textes & infos
        file: _data/settings.json
        fields:
          - { label: Prenom, name: name, widget: string }
          - { label: Nom italique, name: subtitle, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: URL LinkedIn, name: linkedin, widget: string, required: false }
          - { label: URL Instagram, name: instagram, widget: string, required: false }
          - { label: Photo hero, name: photo, widget: image, required: false }
          - { label: Logo nav, name: logo, widget: image, required: false }
          - { label: CV PDF, name: cvPdf, widget: file, required: false }
          - { label: Texte section CV, name: cvDesc, widget: text, required: false }
          - { label: "FR — Description accueil", name: desc, widget: text }
          - { label: "EN — Description accueil", name: desc_en, widget: text }
          - { label: "FR — A propos paragraphe 1", name: about1, widget: text }
          - { label: "EN — A propos paragraphe 1", name: about1_en, widget: text }
          - { label: "FR — A propos paragraphe 2", name: about2, widget: text }
          - { label: "EN — A propos paragraphe 2", name: about2_en, widget: text }
          - { label: "FR — Contact sous-titre", name: contactHeading, widget: string }
          - { label: "EN — Contact sous-titre", name: contactHeading_en, widget: string }
          - { label: "FR — Contact texte", name: contactDesc, widget: text }
          - { label: "EN — Contact texte", name: contactDesc_en, widget: text }
          - { label: "FR — Footer", name: footer, widget: string }
          - { label: "EN — Footer", name: footer_en, widget: string, required: false }

  - name: projects
    label: Projets
    folder: _data/projects
    create: true
    slug: "{{title}}"
    fields:
      - { label: Titre, name: title, widget: string }
      - label: Categorie
        name: cat
        widget: select
        options:
          - { label: Deco, value: deco }
          - { label: Access, value: access }
          - { label: HMC, value: hmc }
          - { label: Regie, value: regie }
          - { label: Scripte, value: scripte }
          - { label: Mise en scene, value: mise-en-scene }
          - { label: Autres, value: autres }
      - { label: Annee, name: year, widget: string, required: false }
      - { label: "FR — Description", name: desc, widget: text, required: false }
      - { label: "EN — Description", name: desc_en, widget: text, required: false }
      - { label: Image principale, name: img, widget: image, required: false }
      - label: Galerie photos
        name: gallery
        widget: list
        required: false
        field: { label: Photo, name: image, widget: image }
      - { label: Lien YouTube, name: yt, widget: string, required: false }

  - name: formation
    label: Formation
    folder: _data/formations
    create: true
    slug: "{{role}}"
    fields:
      - { label: Annee, name: year, widget: string }
      - { label: Intitule, name: role, widget: string }
      - { label: Lieu, name: place, widget: string, required: false }
      - { label: "FR — Description", name: desc, widget: text, required: false }
      - { label: "EN — Description", name: desc_en, widget: text, required: false }
